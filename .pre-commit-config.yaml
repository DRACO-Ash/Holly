# Optional commit hooks (pre-commit install). Each runs the project's own pinned tool from the
# virtualenv or the dashboard's node_modules, so nothing is fetched at commit time, and each is
# a step of the full loop, scripts/verify.sh, which remains the gate for every change.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (check)
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, whole project)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: dashboard-lint
        name: eslint (dashboard)
        entry: sh -c 'cd frontend && npx --no-install eslint src'
        language: system
        files: ^frontend/src/
        pass_filenames: false
