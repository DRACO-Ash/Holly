# The ci-cd skill's Python template, adapted so CI runs exactly the local loop (scripts/verify.sh),
# then the mutation battery that proves two of its self-tests, on the pinned runtimes, installed
# only from the hash-pinned and npm lockfiles. Least privilege throughout.
# The App Store generates its own pipeline; this workflow never deploys.
name: verify
on: { push: {}, pull_request: { branches: [main] } }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the upload nets' self-test forges a commit-graph, which git never writes in a
      # shallow clone, and checkout fetches only the last commit by default.
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      # The dashboard's toolchain; its packages come only from frontend/package-lock.json.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - run: sh scripts/verify.sh
      # Kept out of the loop for the time it takes, five to six minutes: each control of the
      # contrast check and the licence plugin, removed or moved in a copy, must turn the
      # self-test case it names red.
      - run: node scripts/mutation-battery.mjs
