[project]
name = "holly"
version = "0.12.0"
description = "Holly: the daily operations dashboard for SDA watch analysts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies are not declared here. The manifests are requirements-runtime.in (what the image
# installs), requirements.in (the platform's test job: the runtime set and the test runner) and
# requirements-dev.in (tooling); each compiles to the hash-pinned lock of the same name in .txt.

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage flags are deliberately NOT set here. With `--cov` in addopts, the template's
# `coverage run -m pytest && coverage xml` form writes a 0% coverage.xml (the inner and outer
# measurements collide). Without it, all three forms the baseline documents write coverage.xml
# and fail under 80%: `pytest --cov --cov-report=xml`, `pytest --cov=app --cov-report=xml`, and
# `coverage run -m pytest && coverage xml`. A bare `pytest` runs the tests without coverage.
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
# The route and service tests are coroutines; pytest-asyncio runs each in its own event loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
# A command-line module's entry guard runs only under `python -m`, never on import.
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Preview is on only for rules named explicitly: RUF029 is the local twin of SonarQube's
# python:S7503 (an async function that never awaits), which is in the Sonar way profile.
preview = true
explicit-preview-rules = true
select = [
    "A", "ARG", "B", "BLE", "C4", "C90", "DTZ", "E", "ERA", "F", "I", "N",
    "PERF", "PIE", "PL", "PT", "RET", "RUF", "RUF029", "S", "SIM", "UP", "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Matches SonarQube python:S107 (at most 13 parameters), the rule the platform gate applies.
# FastAPI reads every query filter and form field as a handler parameter.
max-args = 13
max-positional-args = 13

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"
files = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# gunicorn ships no type information; only the tests import it, to check setting names.
module = ["gunicorn.*"]
ignore_missing_imports = true

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
