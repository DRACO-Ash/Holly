# sonar-project.properties :: SonarQube Code Quality gate scoping for a Go App Store app.
# Shipped as a scaffold template by deploy-recipes. Commit it at the repository root so the
# platform's Code Quality stage reads coverage from the right path and scopes analysis
# correctly. The gate needs line coverage at least 80%, zero open violations, and every
# security hotspot resolved or reviewed.

sonar.projectKey=CHANGE_ME_project_key
# Go convention: sources and tests live together; test files are *_test.go.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go
# Sonar reads the native Go coverage profile directly. Emit it with
# `go test ./... -coverprofile=coverage.out -covermode=atomic`.
# (Convert with gcov2lcov only if your gate insists on lcov.)
sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8

# COVERAGE exclusions ONLY (never analysis exclusions): a file that cannot be measured
# honestly is excluded from the coverage metric with a written reason, but is still
# analysed for violations. Example, uncomment and justify per file:
# sonar.coverage.exclusions=cmd/server/main.go

# WARNING: the platform runs TWO coverage checks and this file governs only one of them.
# SonarQube's own gate honours sonar.sources and sonar.coverage.exclusions; a separate report
# gate scores coverage on NEW or CHANGED code, ignores both keys, and counts any file absent
# from the coverage report as 0%. Consequences: keep every logic-carrying file importable and
# covered (a no-exports client script is a gate failure no config can hide); when you do
# exclude a directory, spell it BOTH ways (dir/* and dir/**), because Ant-style dir/** does not
# match files sitting directly in dir/; and never change an exclusion as an experiment. Read
# the coverage report and do the arithmetic first, because excluding a file removes its COVERED
# lines too, which once took a project's metric from 76.5% DOWN to 66.4%.
# See appstore-gate-compliance section 2.1 and its Failure 14.

# The gate is FOUR conditions on CHANGED code, not three: new issues 0, coverage at least 80%,
# duplicated lines at most 3%, hotspots reviewed. Duplication is the condition with no analyser
# rule behind it, so it is usually measured for the first time on the platform, where retries are
# capped at one per job and two per pipeline. Wire a local duplication rung into the loop, scoped
# from this file with sonar.tests removed (test files are excluded from all four conditions), and
# fix a failure by extracting the shared block, never by adding an exclusion. Keep vendored and
# generated trees OUT of sonar.sources: the platform analyses third-party source as your own code,
# and that is where duplication density is normally lost. Hotspots cannot be cleared by the app
# owner (the platform team records the disposition), so remove the pattern in code instead.
# See appstore-gate-compliance section 2.2.
